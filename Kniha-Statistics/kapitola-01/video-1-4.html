<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Supplementary video</title>
</head>
<body>
<script src="chapter-links.js?v=20260920-1745-v5"></script>
<script>
(() => {
  const VIDEO_ID = "1-4";

  const item = ((window.CHAPTER_LINKS || {}).supplementary || [])
    .find(x => x.id === VIDEO_ID);

  if (!item || !item.url || /^(VLOZ_|PASTE_)/.test(item.url)) {
    document.body.textContent = "Video link nie je nastavený v chapter-links.js";
    return;
  }

  function directDrivePage(url) {
    try {
      const u = new URL(url, window.location.href);
      if (!/drive\.google\.com$/i.test(u.hostname)) return url;

      let fileId = "";
      const m = u.pathname.match(/\/file\/d\/([^/]+)/);
      if (m) fileId = m[1];
      if (!fileId) fileId = u.searchParams.get("id") || "";

      if (fileId) {
        return "https://drive.google.com/file/d/" + fileId + "/view?usp=sharing";
      }
      return url;
    } catch (_) {
      return url;
    }
  }

  window.location.replace(directDrivePage(item.url));
})();
</script>
</body>
</html>
