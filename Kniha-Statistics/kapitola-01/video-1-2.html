<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Video 1-2</title>
  <style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:600 16px Arial,sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}</style>
</head>
<body>
  <div id="msg">Otváram video…</div>
  <script src="chapter-links.js?v=20260920-1735-v4"></script>
  <script>
  (()=>{
    const id="1-2";
    const item=((window.CHAPTER_LINKS||{}).supplementary||[]).find(x=>x.id===id);
    const msg=document.getElementById('msg');
    const invalid=u=>!u||u.startsWith('VLOZ_')||u.startsWith('PASTE_');
    if(!item||invalid(item.url)){
      msg.textContent='Video link nie je nastavený v chapter-links.js';
      return;
    }
    // Stabilný GitHub link z knihy -> okamžite priamo na aktuálny zdroj videa.
    window.location.replace(item.url);
  })();
  </script>
</body>
</html>
