<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>2.3 Kumulativna pocetnost</title>
  <script src="../video_links.js"></script>
  <style>
    body{font-family:Arial,sans-serif;background:#071018;color:#e8f0f7;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
    main{max-width:760px;padding:32px;text-align:center}
    a{color:#5cc8ff}
  </style>
</head>
<body>
<main>
  <h1>2.3 Kumulativna pocetnost</h1>
  <p id="status">Otváram pomocné video…</p>
  <p><a id="fallback" href="#" hidden>Otvoriť video</a></p>
</main>
<script>
(function(){
  const chapter = "kap2";
  const key = "2-3";
  const map = window.STATISTICS_HELPER_VIDEO_LINKS || {};
  const url = map[chapter] && map[chapter][key];
  const status = document.getElementById("status");
  const fallback = document.getElementById("fallback");
  if (!url || /^VLOZ_LINK_/.test(url)) {
    status.textContent = "Link na video ešte nie je nastavený v video_links.js.";
    return;
  }
  fallback.href = url;
  fallback.hidden = false;
  window.location.replace(url);
})();
</script>
</body>
</html>
